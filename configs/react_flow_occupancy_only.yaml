model:
  kind: react_flow
  mode: occupancy_only
  history_frames: 6
  future_frames: 6
  latent_shape:
  - 16
  - 50
  - 50
  max_actors: 8
  actor_history_frames: 4
  actor_hidden: 128
  actor_heads: 4
  interaction_layers: 2
  latent_scale: 10.0
  time_scalar: 1000.0
  alpha: 3.0
  occ_weight: 1.0
  actor_weight: 1.0
  existence_weight: 0.1
  backbone: occfm_unet
  freeze_backbone: false
  unet_config:
    model_channels: 128
    channel_multi:
    - 2
    - 4
    init_kernel_size: 7
    init_3d_conv_channels: 64
    attn_dim: 32
    temporal_attn_head: 8
    spatial_attn_head: 8
    attention_mode: flash
normalization: data/research/normalization.json
sampling:
  num_worlds: 1
  nfe: 8
  heading_normalization: endpoint_only
  requires_local_generator: true
research_status:
  joint_trained: false
  oracle_observations: true
  physical_future_slots_s:
  - 0.5
  - 1.0
  - 1.5
  - 2.0
  - 2.5
  - 3.0
  future_timestamps_are_targets_only: true
  initialization_conditioning: Restored OccFM U-shaped spatial/temporal DiT; fresh
    initialization unless an explicit trunk checkpoint is supplied.
  cli_integration: Full runner defaults to DiT; --dit-config configs/dit.yaml supplies
    architecture options. This file also specifies research loss/sampling defaults.
